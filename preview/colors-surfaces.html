<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .sw { display: flex; align-items: stretch; gap: 14px; }
  .chip { width: 88px; height: 88px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(26,20,16,.08); flex: none; }
  .meta { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .meta .name { font-family: var(--font-display); font-variation-settings: 'opsz' 24, 'wght' 600; font-size: 17px; letter-spacing: -0.01em; color: var(--text); }
  .meta .role { font-family: var(--font-body); font-size: 12px; color: var(--text-mute); margin-top: 4px; line-height: 1.4; max-width: 22ch; }
  .meta .code { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-faint); margin-top: 6px; }
  .meta .hex { font-family: ui-monospace, monospace; font-weight: 600; font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw">
      <div class="chip" style="background:#FAF7F0;"></div>
      <div class="meta">
        <div class="name">Кремовый фон</div>
        <div class="hex">#FAF7F0</div>
        <div class="role">Основной фон страницы — не белый</div>
        <div class="code">--surface</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#F2EDDF;"></div>
      <div class="meta">
        <div class="name">Карточки</div>
        <div class="hex">#F2EDDF</div>
        <div class="role">Приподнятые поверхности, панели</div>
        <div class="code">--surface-2</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#ECE6D2;"></div>
      <div class="meta">
        <div class="name">Утопленный</div>
        <div class="hex">#ECE6D2</div>
        <div class="role">Футер, тихие секции</div>
        <div class="code">--surface-sunken</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#E8E1D2;"></div>
      <div class="meta">
        <div class="name">Граница</div>
        <div class="hex">#E8E1D2</div>
        <div class="role">Тонкие линии 1px, разделители</div>
        <div class="code">--border</div>
      </div>
    </div>
  </div>
</body></html>
