<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface); font-family: var(--font-body); color: var(--text); }
  .lbl { font-size: 11px; color: var(--text-mute); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; margin-bottom: 10px; }
  .field { margin-bottom: 18px; }
  .label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; display: block; }
  input, textarea { width: 100%; box-sizing: border-box; font-family: var(--font-body); font-size: 15px; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 11px 14px; transition: border 150ms; }
  input::placeholder { color: var(--text-faint); }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26, 116, 37, 0.15); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .error { color: var(--status-sale); font-size: 12px; margin-top: 6px; }
  .err-input { border-color: var(--status-sale); }
</style>
</head>
<body>
  <div class="lbl">ПОЛЯ ВВОДА · обычное · в&nbsp;фокусе · с&nbsp;ошибкой</div>
  <div class="row">
    <div class="field">
      <label class="label">Имя</label>
      <input type="text" placeholder="Линар" value="Линар"/>
    </div>
    <div class="field">
      <label class="label">Телефон</label>
      <input type="text" placeholder="+7 (___) ___-__-__" autofocus/>
    </div>
    <div class="field" style="grid-column: 1 / -1;">
      <label class="label">E-mail</label>
      <input type="email" class="err-input" value="linar@zuray"/>
      <div class="error">Не похоже на адрес — проверьте, пожалуйста.</div>
    </div>
  </div>
</body></html>
