<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface); }
  .row { display: grid; grid-template-columns: 130px 1fr; gap: 24px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .label { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .meta  { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-faint); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div><div class="label">Заголовок H1</div><div class="meta">Playfair Display · wght 500</div></div>
    <h1 style="margin:0; font-size: 32px; font-variation-settings: 'opsz' 72, 'wght' 500; font-weight: 500;">Производство в России с 2018</h1>
  </div>
  <div class="row">
    <div><div class="label">Заголовок H2</div><div class="meta">Playfair Display · wght 500</div></div>
    <h2 style="margin:0; font-size: 26px; font-variation-settings: 'opsz' 48, 'wght' 500; font-weight: 500;">Каждое изделие проходит руки мастера</h2>
  </div>
  <div class="row">
    <div><div class="label">Заголовок H3</div><div class="meta">Playfair Display · wght 600</div></div>
    <h3 style="margin:0; font-size: 20px; font-variation-settings: 'opsz' 24, 'wght' 600; font-weight: 600;">Комплекс «Алтай», 165 см</h3>
  </div>
</body></html>
