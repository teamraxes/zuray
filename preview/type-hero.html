<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface); }
  .row { display: grid; grid-template-columns: 130px 1fr; gap: 24px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .label { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .meta  { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-faint); margin-top: 6px; }
  .spec  { color: var(--text); }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="label">Hero</div>
      <div class="meta">Playfair Display · wght 400</div>
    </div>
    <div class="spec" style="font-family: var(--font-display); font-variation-settings: 'opsz' 144, 'wght' 400; font-size: 64px; line-height: 0.95; letter-spacing: -0.025em;">Кошачья мебель</div>
  </div>
  <div class="row">
    <div>
      <div class="label">Display</div>
      <div class="meta">Playfair Display · wght 500</div>
    </div>
    <div class="spec" style="font-family: var(--font-display); font-variation-settings: 'opsz' 96, 'wght' 500; font-size: 44px; line-height: 0.98; letter-spacing: -0.02em;">Собранная руками</div>
  </div>
</body></html>
