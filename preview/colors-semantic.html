<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .sw { display: flex; align-items: stretch; gap: 14px; }
  .chip { width: 88px; height: 88px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(26,20,16,.08); flex: none; }
  .meta { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .meta .name { font-family: var(--font-display); font-variation-settings: 'opsz' 24, 'wght' 600; font-size: 17px; letter-spacing: -0.01em; color: var(--text); }
  .meta .role { font-family: var(--font-body); font-size: 12px; color: var(--text-mute); margin-top: 4px; line-height: 1.4; max-width: 24ch; }
  .meta .code { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-faint); margin-top: 6px; }
  .meta .hex { font-family: ui-monospace, monospace; font-weight: 600; font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw">
      <div class="chip" style="background:#EB0000;"></div>
      <div class="meta">
        <div class="name">Цена со скидкой</div>
        <div class="hex">#EB0000</div>
        <div class="role">Только функционально — скидка, ошибки формы</div>
        <div class="code">--status-sale</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#1A7425;"></div>
      <div class="meta">
        <div class="name">В наличии</div>
        <div class="hex">#1A7425</div>
        <div class="role">Совпадает с фирменным — успех, наличие</div>
        <div class="code">--success</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#C77F3F;"></div>
      <div class="meta">
        <div class="name">Мало осталось</div>
        <div class="hex">#C77F3F</div>
        <div class="role">Терракота — предупреждение, низкий остаток</div>
        <div class="code">--warning</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#F5E4D1;"></div>
      <div class="meta">
        <div class="name">Тэг-плашка</div>
        <div class="hex">#F5E4D1</div>
        <div class="role">Фон чипов «Особенности»</div>
        <div class="code">--accent-soft</div>
      </div>
    </div>
  </div>
</body></html>
