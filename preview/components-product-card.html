<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-body); color: var(--text); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 200ms cubic-bezier(0.4,0,0.2,1), box-shadow 200ms; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -8px rgba(26, 20, 16, 0.12); }
  .photo { position: relative; aspect-ratio: 4 / 5; background: var(--surface); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; transition: transform 400ms cubic-bezier(0.4,0,0.2,1); }
  .card:hover .photo img { transform: scale(1.03); }
  .sale-badge { position: absolute; top: 12px; left: 12px; background: var(--status-sale); color: white; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.04em; }
  .body { padding: 14px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .name { font-family: var(--font-display); font-variation-settings: 'opsz' 24, 'wght' 600; font-size: 17px; line-height: 1.2; letter-spacing: -0.01em; }
  .meta { font-size: 12px; color: var(--text-mute); letter-spacing: 0.02em; }
  .priceline { display: flex; align-items: baseline; gap: 8px; margin-top: auto; }
  .price { font-family: var(--font-display); font-variation-settings: 'opsz' 36, 'wght' 500; font-size: 22px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .price-sale { color: var(--status-sale); }
  .price-old { font-family: var(--font-display); font-size: 15px; color: var(--text-mute); text-decoration: line-through; font-variant-numeric: tabular-nums; }
  .btn { font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 0; height: 40px; border: none; border-radius: 8px; cursor: pointer; background: var(--brand); color: var(--surface); transition: background 150ms; }
  .btn:hover { background: var(--brand-ink); }
</style>
</head>
<body>
  <div class="row">
    <div class="card">
      <div class="photo"><img src="../assets/products/02.png" alt=""/></div>
      <div class="body">
        <div class="name">Когтеточка с домиком</div>
        <div class="meta">31 × 31 × 95 см · ковролин</div>
        <div class="priceline">
          <span class="price">₽4 290</span>
        </div>
        <button class="btn">В корзину</button>
      </div>
    </div>

    <div class="card">
      <div class="photo">
        <img src="../assets/products/altai-cream.png" alt=""/>
        <span class="sale-badge">−20%</span>
      </div>
      <div class="body">
        <div class="name">Комплекс «Алтай», 165 см</div>
        <div class="meta">обмотка — джут</div>
        <div class="priceline">
          <span class="price price-sale">₽10 320</span>
          <span class="price-old">₽12 900</span>
        </div>
        <button class="btn">В корзину</button>
      </div>
    </div>
  </div>
</body></html>
