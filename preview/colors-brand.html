<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; background: var(--surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .sw { display: flex; align-items: stretch; gap: 14px; }
  .chip { width: 88px; height: 88px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(26,20,16,.06); flex: none; }
  .meta { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .meta .name { font-family: var(--font-display); font-variation-settings: 'opsz' 24, 'wght' 600; font-size: 17px; letter-spacing: -0.01em; color: var(--text); }
  .meta .role { font-family: var(--font-body); font-size: 12px; color: var(--text-mute); margin-top: 4px; line-height: 1.4; max-width: 22ch; }
  .meta .code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; color: var(--text-faint); margin-top: 6px; }
  .meta .hex { font-family: ui-monospace, monospace; font-weight: 600; font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw">
      <div class="chip" style="background:#1A7425;"></div>
      <div class="meta">
        <div class="name">Фирменный зелёный</div>
        <div class="hex">#1A7425</div>
        <div class="role">CTA, активные ссылки, логотип</div>
        <div class="code">--brand</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#0F4419;"></div>
      <div class="meta">
        <div class="name">Тёмный лесной</div>
        <div class="hex">#0F4419</div>
        <div class="role">Состояние hover, плотные заголовки</div>
        <div class="code">--brand-ink</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#E6F0E2;"></div>
      <div class="meta">
        <div class="name">Зелёный осветлённый</div>
        <div class="hex">#E6F0E2</div>
        <div class="role">Выбранные фильтры, бейдж «в наличии»</div>
        <div class="code">--brand-soft</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#C77F3F;"></div>
      <div class="meta">
        <div class="name">Терракота</div>
        <div class="hex">#C77F3F</div>
        <div class="role">Тёплый акцент производства, теги, цифры</div>
        <div class="code">--accent</div>
      </div>
    </div>
  </div>
</body></html>
