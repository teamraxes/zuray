<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 0; background: var(--surface); font-family: var(--font-body); color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--surface); }
  .ph { position: relative; aspect-ratio: 1 / 1; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lbl { position: absolute; bottom: 8px; left: 10px; right: 10px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
</style>
</head>
<body>
  <div class="grid">
    <div class="ph"><img src="../assets/products/03.png" alt=""/><span class="lbl">Лайфстайл · в&nbsp;интерьере</span></div>
    <div class="ph"><img src="../assets/products/altai-cream.png" alt=""/><span class="lbl">Кошка как герой</span></div>
    <div class="ph"><img src="../assets/products/06.png" alt=""/><span class="lbl">Каталожный кадр</span></div>
  </div>
</body></html>
