<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 32px; background: var(--surface); font-family: var(--font-body); color: var(--text); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .btn { font-family: var(--font-body); font-weight: 600; font-size: 15px; letter-spacing: 0; padding: 0 22px; height: 44px; border-radius: 8px; border: none; cursor: pointer; transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1); display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--brand); color: var(--surface); }
  .btn-primary:hover { background: var(--brand-ink); }
  .btn-ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--text); }
  .btn-ghost:hover { background: var(--text); color: var(--surface); }
  .btn-text { background: transparent; color: var(--text); padding: 0; height: auto; }
  .btn-disabled { background: var(--brand); color: var(--surface); opacity: 0.4; cursor: not-allowed; }
  .arrow { width: 18px; height: 18px; }
  .lbl { font-size: 11px; color: var(--text-mute); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="lbl">КНОПКИ · основная · контурная · текстовая · отключённая</div>
  <div class="row">
    <button class="btn btn-primary">В корзину</button>
    <button class="btn btn-ghost">Экскурсия на производство</button>
    <button class="btn btn-text">Все категории
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </button>
    <button class="btn btn-disabled" disabled>Нет в наличии</button>
  </div>
</body></html>
